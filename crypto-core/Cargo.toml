[package]
name = "crypto-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["keygen"]
keygen = ["dep:num-prime"]

[dependencies]
hex = "0.4.3"
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-prime = { version = "0.7.0", features = ["big-int"], optional = true }
num-traits = "0.2.19"
rand08 = { version = "0.8.8", package = "rand" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
thiserror = "2.0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }


