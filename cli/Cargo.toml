[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hevote"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crypto-core = { path = "../crypto-core" }
hex = "0.4"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"