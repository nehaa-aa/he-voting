[package]
name = "he-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-core = { path = "../crypto-core", default-features = false }
wasm-bindgen = "0.2"
hex = "0.4"
num-bigint = "0.4"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false